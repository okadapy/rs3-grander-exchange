service_name: recipe-service
port: 8082
log_level: debug
env: local

mysql:
  host: mysql
  port: 3306
  user: rs3
  password: rs3pass
  db_name: recipe_db
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 1h

redis:
  addr: redis:6379
  password: ""
  db: 0
  pool_size: 20

weirdgloop:
  base_url: "https://api.weirdgloop.org/exchange/history/rs"
  user_agent: "RS3-Market-Backend/1.0 (contact@example.com)"
  batch_size: 100
  min_gap: 500ms
  http_timeout: 15s

services:
  recipe_url: "http://recipe-service:8082"
