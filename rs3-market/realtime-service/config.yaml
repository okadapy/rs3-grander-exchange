service_name: realtime-service
port: 8085
log_level: debug
env: local

mysql:
  host: mysql
  port: 3306
  user: rs3
  password: rs3pass
  db_name: chat_db
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 1h

redis:
  addr: redis:6379
  password: ""
  db: 0
  pool_size: 20

jwt:
  secret: "dev-secret-change-me"
  expiry: 24h

chat:
  rate_limit_window: 3s
  history_limit: 50
