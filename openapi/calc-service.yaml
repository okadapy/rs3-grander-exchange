info:
  title: RS3 Market — calc-service
  version: 2.0.0
  description: 'Endpoints served by **calc-service**, extracted from the combined specification.


    This copy exists for debugging one service in isolation. Generate clients from `openapi/combined.yaml`,
    which describes the whole gateway surface.


    Generated by `scripts/split_openapi.py` — do not edit by hand.'
servers:
- url: /
  description: calc-service
security: []
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Gateway liveness
      responses:
        '200':
          description: Gateway is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /calc/{itemID}:
    get:
      tags:
      - calc
      operationId: calculateItem
      summary: Profitability of every way to produce an item
      description: 'Walks the recipe tree and evaluates each combination of buying

        versus crafting each input, returning one `CalcPath` per

        strategy, best first.


        Ranking puts paths the player can actually perform first (when

        `player` is supplied), then complete paths, then by the

        throughput-limited GP/h where a buy limit is known.

        '
      parameters:
      - $ref: '#/components/parameters/ItemIdPath'
      - name: aph
        in: query
        description: 'Override actions-per-hour for every step. Omit to use each

          recipe''s own value.

          '
        schema:
          type: integer
          minimum: 0
      - name: spread_pct
        in: query
        description: 'Override the assumed round-trip buy/sell spread, as a

          percentage of the guide price. Omit to use the server

          default.

          '
        schema:
          type: number
          format: double
          minimum: 0
          maximum: 100
      - name: player
        in: query
        description: 'RS3 display name. When supplied, each path is annotated with

          the skill levels it needs and whether this player has them.

          '
        schema:
          type: string
      - $ref: '#/components/parameters/HiscoreMode'
      - name: include_incomplete
        in: query
        description: 'Include paths with an input we could not price. Their money

          figures are upper bounds — the unpriced input is costed at

          zero — so they are excluded by default.

          '
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/CalcBoosts'
      responses:
        '200':
          description: Ranked production strategies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalcResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No recipe exists for this item, or none can be priced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /calc/batch:
    get:
      tags:
      - calc
      operationId: calculateBatch
      summary: Profitability for several items at once
      description: 'Errors are reported per entry, so one unpriceable item does not

        fail the request.

        '
      parameters:
      - name: ids
        in: query
        required: true
        description: Comma-separated item IDs.
        schema:
          type: string
        example: 1513,1515,2363
      - name: aph
        in: query
        schema:
          type: integer
          minimum: 0
      - name: spread_pct
        in: query
        schema:
          type: number
          format: double
          minimum: 0
          maximum: 100
      - name: player
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/HiscoreMode'
      - name: include_incomplete
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/CalcBoosts'
      responses:
        '200':
          description: One entry per requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalcBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /calc/top:
    get:
      tags:
      - calc
      operationId: calculateTop
      summary: The catalogue ranked by one headline metric
      description: 'Walks every priceable recipe — around 5800 of them — and returns

        the best path for each, ranked by `metric`. Answers from cache

        on anything but the first call for a given parameter set.


        `metric` is required; there is no default, because asking for a

        ranking without saying of what is a mistake worth reporting

        rather than guessing at.


        `gp_per_hour` ranks on `gp_per_hour_limited`, the buy-limit-bound

        rate, not the raw `gp_per_hour`. The raw figure multiplies one

        craft''s profit by a full hour of actions, which floats items

        nobody can produce at that rate — a godsword nobody forges six

        hundred times an hour — above the things people actually craft.


        An item whose calculation fails (no priceable path, upstream

        error) is simply absent from the ranking rather than failing the

        whole request, the same reasoning `/calc/batch` uses to report

        failures per entry.

        '
      parameters:
      - name: metric
        in: query
        required: true
        description: What to rank by. No default.
        schema:
          $ref: '#/components/schemas/TopMetric'
      - name: player
        in: query
        description: 'RS3 display name. When supplied, actions-per-hour for

          Smithing recipes is derived from this player''s levels where

          the mechanics allow it.

          '
        schema:
          type: string
      - name: skill
        in: query
        description: Restrict the ranking to recipes of this skill.
        schema:
          type: string
      - name: limit
        in: query
        description: Rows to return. Defaults to 20, capped at 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: include_incomplete
        in: query
        description: 'Include paths with an input we could not price. Their money

          figures are upper bounds, so they are excluded by default.

          '
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/CalcBoosts'
      responses:
        '200':
          description: The catalogue ranked by `metric`, best first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
tags:
- name: calc
  description: Profitability of producing an item.
- name: health
  description: Liveness and upstream status.
components:
  parameters:
    CalcBoosts:
      name: boosts
      in: query
      description: 'Comma-separated forging boosts to assume when simulating a

        Smithing anvil recipe (`aph_source: ticks_forge`). Ignored by

        every other recipe. Unknown tokens are rejected with a 400

        rather than silently ignored. Recognised tokens: `smithing_cape`,

        `careless5`, `luminite`, `rapid4`, `tinker2`, `juju`, `varrock4`,

        `crystal_hammer`, `equipment20` (raises `rapid4` and `tinker2` to

        their equipment-level-20 values). Omit for the conservative

        floor — no perk or potion assumed.

        '
      schema:
        type: string
      example: smithing_cape,rapid4,equipment20
    HiscoreMode:
      name: mode
      in: query
      description: Hiscore table to read.
      schema:
        $ref: '#/components/schemas/HiscoreMode'
    ItemIdPath:
      name: itemID
      in: path
      required: true
      description: Grand Exchange item ID.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1513
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AphSource:
      type: string
      description: 'Where a recipe''s actions-per-hour came from. `default` means it

        is a house assumption, not a measured rate — the wiki rarely

        publishes one. Treat `default` figures as good for ranking

        recipes against each other, not as literal throughput. `ticks`,

        `ticks_level` and `ticks_forge` are derived from the wiki''s tick

        cost and Smithing mechanics rather than assumed; `ticks_level`

        and `ticks_forge` additionally require a `player`, since they

        depend on skill levels.

        '
      enum:
      - wiki
      - default
      - override
      - ticks
      - ticks_level
      - ticks_forge
    CalcAssumptions:
      type: object
      required:
      - price_basis
      - spread_pct
      - tax_pct
      - tax_cap_per_item
      - tax_exempt_below
      - inventory_slots
      - bank_trip_ticks
      properties:
        price_basis:
          type: string
          enum:
          - ge_guide_price
          description: What the underlying price numbers actually are.
        spread_pct:
          type: number
          format: double
          description: 'Assumed round-trip buy/sell gap. Buys modelled at

            `price * (1 + spread/200)`, sells at `price * (1 - spread/200)`.

            '
        tax_pct:
          type: number
          format: double
        tax_cap_per_item:
          type: integer
          format: int64
        tax_exempt_below:
          type: integer
          format: int64
        player:
          type: string
        mode:
          $ref: '#/components/schemas/HiscoreMode'
        inventory_slots:
          type: integer
          description: 'Inventory slots assumed available before a bank trip is

            needed, feeding every actions-per-hour figure derived from

            ticks (`aph_source` of `ticks`, `ticks_level` or

            `ticks_forge`).

            '
        bank_trip_ticks:
          type: integer
          description: Ticks charged for a bank trip when the inventory runs out.
        boosts:
          type: string
          description: 'The `boosts` query parameter, echoed back verbatim. Absent

            when no boosts were declared.

            '
    CalcBatchEntry:
      type: object
      required:
      - item_id
      properties:
        item_id:
          type: integer
          format: int64
        result:
          oneOf:
          - $ref: '#/components/schemas/CalcResult'
          - type: 'null'
        error:
          type: string
          description: Set instead of `result` when this item failed.
    CalcBatchResponse:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/CalcBatchEntry'
    CalcPath:
      type: object
      description: One strategy for producing the item.
      required:
      - path
      - steps
      - profit_per_craft
      - gp_per_hour
      - xp_per_hour
      - gp_per_xp
      - roi_pct
      - total_hours
      - total_xp
      - buy_cost
      - sell_revenue
      - tax_paid
      - actions_per_hour
      - aph_source
      - complete
      properties:
        path:
          type: array
          description: Recipe names in execution order.
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CalcStep'
        profit_per_craft:
          type: number
          format: double
          description: Net GP per craft of the final output, after tax.
        gp_per_hour:
          type: number
          format: double
          description: 'Unconstrained rate. Prefer `throughput.gp_per_hour` when

            present — this figure ignores buy limits.

            '
        xp_per_hour:
          type: number
          format: double
        gp_per_xp:
          type: number
          format: double
        roi_pct:
          type: number
          format: double
        total_hours:
          type: number
          format: double
        total_xp:
          type: number
          format: double
        buy_cost:
          type: number
          format: double
        sell_revenue:
          type: number
          format: double
        tax_paid:
          type: number
          format: double
        actions_per_hour:
          type: integer
        aph_source:
          $ref: '#/components/schemas/AphSource'
        complete:
          type: boolean
          description: 'False means an input had no price and was costed at zero, so

            every money figure here is an upper bound. Only ever false

            when `include_incomplete=true` was passed.

            '
        unpriced_inputs:
          type: array
          description: Names of inputs that could not be priced.
          items:
            type: string
        throughput:
          description: Null when no bought input has a known buy limit.
          oneOf:
          - $ref: '#/components/schemas/CalcThroughput'
          - type: 'null'
        meets_requirements:
          type:
          - boolean
          - 'null'
          description: Null unless a `player` was supplied.
        skill_requirements:
          type: array
          description: Present only when a `player` was supplied.
          items:
            $ref: '#/components/schemas/SkillRequirement'
    CalcResult:
      type: object
      required:
      - item_id
      - generated_at
      - assumptions
      - paths
      - cached
      properties:
        item_id:
          type: integer
          format: int64
        generated_at:
          type: string
          format: date-time
        assumptions:
          $ref: '#/components/schemas/CalcAssumptions'
        paths:
          type: array
          description: Best first.
          items:
            $ref: '#/components/schemas/CalcPath'
        cached:
          type: boolean
    CalcStep:
      type: object
      required:
      - recipe
      - skill
      - level_req
      - xp
      - aph
      - aph_source
      - runs
      - buy_cost
      - sell_revenue
      - profit
      properties:
        recipe:
          type: string
        skill:
          type: string
        level_req:
          type: integer
        xp:
          type: number
          format: double
        aph:
          type: integer
        aph_source:
          $ref: '#/components/schemas/AphSource'
        runs:
          type: integer
          description: Times this step runs per unit of the final output.
        buy_cost:
          type: number
          format: double
        sell_revenue:
          type: number
          format: double
        profit:
          type: number
          format: double
    CalcThroughput:
      type: object
      description: 'The ceiling the Grand Exchange buy limits put on a strategy,

        regardless of how fast you can click. Usually far below

        `gp_per_hour`.

        '
      required:
      - binding_item_id
      - binding_item_name
      - binding_limit_4h
      - max_crafts_per_4h
      - crafts_per_hour
      - gp_per_hour
      properties:
        binding_item_id:
          type: integer
          format: int64
        binding_item_name:
          type: string
          description: The bought input whose buy limit binds hardest.
        binding_limit_4h:
          type: integer
        max_crafts_per_4h:
          type: integer
        crafts_per_hour:
          type: number
          format: double
          description: The lower of actions-per-hour and the buy-limit rate.
        gp_per_hour:
          type: number
          format: double
          description: Profit per craft at the limit-constrained rate.
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable failure reason.
    HealthStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
    HiscoreMode:
      type: string
      enum:
      - normal
      - ironman
      - hardcore
      default: normal
    SkillRequirement:
      type: object
      required:
      - skill
      - required
      - actual
      - met
      properties:
        skill:
          type: string
        required:
          type: integer
        actual:
          type: integer
          description: The player's level; `0` if they lack the skill.
        met:
          type: boolean
    TopMetric:
      type: string
      description: What /calc/top ranks by. No default — it is required.
      enum:
      - xp_per_hour
      - gp_per_hour
      - gp_per_xp
    TopResponse:
      type: object
      required:
      - metric
      - count
      - rows
      - assumptions
      properties:
        metric:
          $ref: '#/components/schemas/TopMetric'
        count:
          type: integer
          description: Number of rows returned (at most `limit`).
        rows:
          type: array
          description: Best first, by `metric`.
          items:
            $ref: '#/components/schemas/TopRow'
        assumptions:
          $ref: '#/components/schemas/CalcAssumptions'
    TopRow:
      type: object
      description: The best production path for one item, under one metric.
      required:
      - item_id
      - name
      - skill
      - level_req
      - xp_per_hour
      - gp_per_hour
      - gp_per_hour_limited
      - gp_per_xp
      - actions_per_hour
      - aph_source
      - complete
      properties:
        item_id:
          type: integer
          format: int64
        name:
          type: string
        skill:
          type: string
        level_req:
          type: integer
        xp_per_hour:
          type: number
          format: double
        gp_per_hour:
          type: number
          format: double
          description: 'Unconstrained rate. `gp_per_hour` ranks on

            `gp_per_hour_limited` instead — prefer that field.

            '
        gp_per_hour_limited:
          type: number
          format: double
          description: '`gp_per_hour` capped by the binding input''s Grand Exchange

            buy limit where one is known, equal to `gp_per_hour`

            otherwise. This is the field `metric=gp_per_hour` sorts on.

            '
        gp_per_xp:
          type: number
          format: double
        actions_per_hour:
          type: integer
        aph_source:
          $ref: '#/components/schemas/AphSource'
        complete:
          type: boolean
          description: 'False means an input had no price and was costed at zero.

            Only ever false when `include_incomplete=true` was passed.

            '
        binding_item_name:
          type: string
          description: 'The bought input whose buy limit produced

            `gp_per_hour_limited`. Absent when no bought input has a

            known buy limit.

            '
