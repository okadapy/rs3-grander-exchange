        '
      required:
      - binding_item_id
      - binding_item_name
      - binding_limit_4h
      - max_crafts_per_4h
      - crafts_per_hour
      - gp_per_hour
      properties:
        binding_item_id:
          type: integer
          format: int64
        binding_item_name:
          type: string
          description: The bought input whose buy limit binds hardest.
        binding_limit_4h:
          type: integer
        max_crafts_per_4h:
          type: integer
        crafts_per_hour:
          type: number
          format: double
          description: The lower of actions-per-hour and the buy-limit rate.
        gp_per_hour:
          type: number
          format: double
          description: Profit per craft at the limit-constrained rate.
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable failure reason.
    HealthStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
    HiscoreMode:
      type: string
      enum:
      - normal
      - ironman
      - hardcore
      default: normal
    SkillRequirement:
      type: object
      required:
      - skill
      - required
      - actual
      - met
      properties:
        skill:
          type: string
        required:
          type: integer
        actual:
          type: integer
          description: The player's level; `0` if they lack the skill.
        met:
          type: boolean
