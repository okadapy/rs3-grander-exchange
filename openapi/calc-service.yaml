tags:
- name: calc
  description: Profitability of producing an item.
- name: health
  description: Liveness and upstream status.
components:
  parameters:
    HiscoreMode:
      name: mode
      in: query
      description: Hiscore table to read.
      schema:
        $ref: '#/components/schemas/HiscoreMode'
    ItemIdPath:
      name: itemID
      in: path
      required: true
      description: Grand Exchange item ID.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1513
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AphSource:
      type: string
      description: 'Where a recipe''s actions-per-hour came from. `default` means it

        is a house assumption, not a measured rate — the wiki rarely

        publishes one. Treat `default` figures as good for ranking

        recipes against each other, not as literal throughput.

        '
      enum:
      - wiki
      - default
      - override
    CalcAssumptions:
      type: object
      required:
      - price_basis
      - spread_pct
      - tax_pct
      - tax_cap_per_item
      - tax_exempt_below
      properties:
        price_basis:
          type: string
          enum:
          - ge_guide_price
          description: What the underlying price numbers actually are.
        spread_pct:
          type: number
          format: double
          description: 'Assumed round-trip buy/sell gap. Buys modelled at

            `price * (1 + spread/200)`, sells at `price * (1 - spread/200)`.

            '
        tax_pct:
          type: number
          format: double
        tax_cap_per_item:
          type: integer
          format: int64
        tax_exempt_below:
          type: integer
          format: int64
        player:
          type: string
        mode:
          $ref: '#/components/schemas/HiscoreMode'
    CalcBatchEntry:
      type: object
      required:
      - item_id
      properties:
        item_id:
          type: integer
          format: int64
        result:
          oneOf:
          - $ref: '#/components/schemas/CalcResult'
          - type: 'null'
        error:
          type: string
          description: Set instead of `result` when this item failed.
    CalcBatchResponse:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/CalcBatchEntry'
    CalcPath:
      type: object
      description: One strategy for producing the item.
      required:
      - path
      - steps
      - profit_per_craft
      - gp_per_hour
      - xp_per_hour
      - gp_per_xp
      - roi_pct
      - total_hours
      - total_xp
      - buy_cost
      - sell_revenue
      - tax_paid
      - actions_per_hour
      - aph_source
      - complete
      properties:
        path:
          type: array
          description: Recipe names in execution order.
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CalcStep'
        profit_per_craft:
          type: number
          format: double
          description: Net GP per craft of the final output, after tax.
        gp_per_hour:
          type: number
          format: double
          description: 'Unconstrained rate. Prefer `throughput.gp_per_hour` when

            present — this figure ignores buy limits.

            '
        xp_per_hour:
          type: number
          format: double
        gp_per_xp:
          type: number
          format: double
        roi_pct:
          type: number
          format: double
        total_hours:
          type: number
          format: double
        total_xp:
          type: number
          format: double
        buy_cost:
          type: number
          format: double
        sell_revenue:
          type: number
          format: double
        tax_paid:
          type: number
          format: double
        actions_per_hour:
          type: integer
        aph_source:
          $ref: '#/components/schemas/AphSource'
        complete:
          type: boolean
          description: 'False means an input had no price and was costed at zero, so

            every money figure here is an upper bound. Only ever false

            when `include_incomplete=true` was passed.

            '
        unpriced_inputs:
          type: array
          description: Names of inputs that could not be priced.
          items:
            type: string
        throughput:
