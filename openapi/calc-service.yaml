          oneOf:
          - $ref: '#/components/schemas/CalcThroughput'
          - type: 'null'
        meets_requirements:
          type:
          - boolean
          - 'null'
          description: Null unless a `player` was supplied.
        skill_requirements:
          type: array
          description: Present only when a `player` was supplied.
          items:
            $ref: '#/components/schemas/SkillRequirement'
    CalcResult:
      type: object
      required:
      - item_id
      - generated_at
      - assumptions
      - paths
      - cached
      properties:
        item_id:
          type: integer
          format: int64
        generated_at:
          type: string
          format: date-time
        assumptions:
          $ref: '#/components/schemas/CalcAssumptions'
        paths:
          type: array
          description: Best first.
          items:
            $ref: '#/components/schemas/CalcPath'
        cached:
