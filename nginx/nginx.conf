# The single front door. The browser only ever talks to this server, so
# the API is same-origin with the app and the CORS layer behind it never
# has to fire in normal use.

upstream frontend { server frontend:80; }
upstream gateway  { server gateway:8080; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # A recipe tree walk over the whole catalogue is measured in seconds,
  # not milliseconds, so the default 60s proxy read timeout would cut a
  # cold GET /calc/top off mid-answer.
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Chat is a WebSocket, and it stays open. No read timeout here, and
  # the upgrade headers have to survive the hop.
  location /ws {
    proxy_pass http://gateway;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  # Everything the gateway owns. Listed one by one rather than behind an
  # /api prefix because these are the paths the OpenAPI contract names,
  # and rewriting them here would make the published spec a lie.
  location /hiscore { proxy_pass http://gateway; }
  location /recipes { proxy_pass http://gateway; }
  location /search  { proxy_pass http://gateway; }
  location /items   { proxy_pass http://gateway; }
  location /prices  { proxy_pass http://gateway; }
  location /calc    { proxy_pass http://gateway; }
  location /auth    { proxy_pass http://gateway; }
  location /chat    { proxy_pass http://gateway; }
  location /health  { proxy_pass http://gateway; }
  location /swagger { proxy_pass http://gateway; }

  # Anything else is the single-page app.
  location / { proxy_pass http://frontend; }
}
