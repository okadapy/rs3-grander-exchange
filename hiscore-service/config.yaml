service_name: hiscore-service
port: 8081
log_level: debug
env: local

mysql:
  host: mysql
  port: 3306
  user: rs3
  password: rs3pass
  db_name: hiscore_db
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 1h

redis:
  addr: redis:6379
  password: ""
  db: 0
  pool_size: 20

hiscore:
  base_url: "https://secure.runescape.com"
  cache_ttl: 5m
