server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # The session JWT lives in localStorage, so a script-src of 'self' is the
  # cheapest second line of defence there is. Emotion injects MUI's styles as
  # inline <style> elements, hence 'unsafe-inline' for styles only; item icons
  # come from the RuneScape item database, and __API_ORIGIN__ is replaced at
  # image build time with the gateway's http(s) and ws(s) origins.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://secure.runescape.com; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
